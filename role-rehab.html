<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFHS — リハ</title>
  <script src="afhs-common.js"></script>
  <style>
    :root {
      --bg:#D6D1C2; --dark:#1C3530; --a1:#4E7868; --a2:#3A6E5E; --a3:#286858;
      --a4:#1E6068; --a5:#1C5A72; --a6:#196E96; --warn:#B86018; --white:#FFFFFF;
      --border: color-mix(in srgb, var(--dark) 18%, var(--white));
      --muted: color-mix(in srgb, var(--dark) 75%, var(--bg));
      --subtle: color-mix(in srgb, var(--dark) 52%, var(--bg));
      --shadow-s: 0 2px 8px color-mix(in srgb, var(--dark) 12%, transparent);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--dark); min-height: 100vh; font-size: 16px; line-height: 1.55;
    }
    .shell { max-width: 880px; margin: 0 auto; }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(118deg, color-mix(in srgb, var(--dark) 52%, var(--a3)), color-mix(in srgb, var(--a5) 42%, var(--a6)));
      padding: 13px 16px; display: flex; align-items: center; gap: 8px;
    }
    .header a { color: color-mix(in srgb, var(--white) 88%, var(--a6)); text-decoration: none; font-weight: 700; }
    .header h1 { color: #fff; font-size: 16px; font-weight: 800; }
    .band { padding: 28px 18px; background: color-mix(in srgb, var(--a1) 14%, var(--bg)); }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--a2); margin-bottom: 8px; }
    .h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .lead { color: var(--muted); font-size: 15px; }
    .section { padding: 20px 18px 32px; }
    .card {
      background: var(--white); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow-s);
    }
    .card-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--a2); margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid color-mix(in srgb, var(--a1) 18%, var(--white));
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chips button {
      border: 1px solid var(--border); background: var(--white); border-radius: 999px;
      padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--muted);
    }
    .chips button.active { background: var(--a3); color: var(--white); border-color: var(--a3); }
    .note-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
    .note-meta { font-size: 11px; color: var(--subtle); margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
    .note-meta .pin { color: var(--warn); font-weight: 800; }
    .note-body { font-size: 14px; white-space: pre-wrap; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--subtle); margin-bottom: 6px; }
    select, textarea {
      width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 16px; font-family: inherit; margin-bottom: 10px;
    }
    textarea { min-height: 88px; }
    .check { display: flex; gap: 8px; font-size: 13px; color: var(--muted); margin: 8px 0 12px; }
    .check input { width: 18px; height: 18px; accent-color: var(--a3); }
    .warn { font-size: 12px; color: var(--warn); margin-bottom: 10px; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 9px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      background: linear-gradient(118deg, var(--a3), var(--a5)); color: #fff;
    }
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--dark); color: #fff; padding: 10px 18px; border-radius: 8px;
      font-size: 14px; font-weight: 600; z-index: 999; transition: transform .25s; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="shell">
  <header class="header">
    <a href="index.html">‹ ポータル</a>
    <h1 style="margin-left:8px">AFHS · リハ</h1>
  </header>

  <section class="band">
    <div class="eyebrow">ROLE</div>
    <div class="h2">リハ</div>
    <p class="lead">ヒアリング後に公開。いまはメモの投稿・一覧だけ使えます。</p>
  </section>

  <section class="section" id="notes">
    <p class="warn">氏名・患者ID・ベッド番号は書かない</p>
    <div class="card">
      <div class="card-title">この職種のメモ</div>
      <div class="chips" id="type-filters"></div>
      <div id="notes-list"><p style="font-size:13px;color:var(--subtle)">読み込み中…</p></div>
    </div>
    <div class="card">
      <div class="card-title">投稿</div>
      <label for="note-type">種別</label>
      <select id="note-type"></select>
      <label for="note-body">本文</label>
      <textarea id="note-body" maxlength="500"></textarea>
      <label class="check"><input type="checkbox" id="note-privacy"><span>患者を特定できる情報を含めていない</span></label>
      <button class="btn" type="button" onclick="submitNote()">投稿する</button>
    </div>
  </section>
</div>
<div id="toast"></div>
<script>
  const ROLE = 'リハ';
  let filterType = 'すべて';
  let _tt;
  function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2600); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function buildFilters(){
    const types=['すべて'].concat(AFHS.CONFIG.noteTypes);
    const tf=document.getElementById('type-filters');
    tf.innerHTML=types.map(t=>`<button type="button" data-v="${t}" class="${t===filterType?'active':''}">${t}</button>`).join('');
    tf.onclick=e=>{ const b=e.target.closest('button'); if(!b)return; filterType=b.dataset.v; buildFilters(); refreshNotes(); };
  }
  async function refreshNotes(){
    const el=document.getElementById('notes-list');
    try{
      const res=await AFHS.listNotes({ role: ROLE, type: filterType });
      if(!res.ok){ el.innerHTML=`<p style="font-size:13px;color:var(--subtle)">${res.reason==='unset'?'設定後に表示されます':AFHS.friendlyErrorMessage(res.reason)}</p>`; return; }
      if(!res.notes.length){ el.innerHTML='<p style="font-size:13px;color:var(--subtle)">まだメモがありません</p>'; return; }
      el.innerHTML=res.notes.map(n=>`<div class="note-item"><div class="note-meta">${n.pinned?'<span class="pin">重要</span>':''}<span>${n.type}</span><span>${n.at||''}</span></div><div class="note-body">${escapeHtml(n.body)}</div></div>`).join('');
    }catch(_){ el.innerHTML='<p style="font-size:13px;color:var(--subtle)">読み込めません</p>'; }
  }
  async function submitNote(){
    const type=document.getElementById('note-type').value;
    const body=document.getElementById('note-body').value.trim();
    if(!body){ toast('本文を入力してください'); return; }
    if(!document.getElementById('note-privacy').checked){ toast('確認チェックを入れてください'); return; }
    try{
      const json=await AFHS.postNote({ role: ROLE, type, body });
      if(json.status!=='ok'){ toast(AFHS.friendlyErrorMessage(json.message)); return; }
      AFHS.ls('preferredRole', ROLE);
      document.getElementById('note-body').value='';
      document.getElementById('note-privacy').checked=false;
      toast(json.test?'テストモードのため未送信':'投稿しました');
      refreshNotes();
    }catch(err){ toast(err.message||'投稿に失敗しました'); }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    AFHS.applyUrlParams();
    document.getElementById('note-type').innerHTML=AFHS.CONFIG.noteTypes.map(t=>`<option value="${t}">${t}</option>`).join('');
    buildFilters();
    refreshNotes();
  });
</script>
</body>
</html>
